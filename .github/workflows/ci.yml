name: CI

on:
  pull_request:
  push:
    branches:
      - master
      - main

permissions:
  contents: read

jobs:
  check:
    name: pnpm check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable corepack
        run: corepack enable

      - name: Install pnpm from packageManager
        run: corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.auto-install-peers=false

      - name: Package hygiene check
        run: pnpm check

      - name: Unit tests
        run: pnpm test

      - name: Setup Bun for Pstack tools
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - name: Install Pstack tool dependencies
        working-directory: packages/pi-pstack/skills/poteto-mode/scripts
        run: bun install --frozen-lockfile

      - name: Pstack tool types and regression tests
        working-directory: packages/pi-pstack/skills/poteto-mode/scripts
        run: bun run typecheck && bun run test
