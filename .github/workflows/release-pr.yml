name: Release PR

on:
  push:
    branches:
      - master
      - main

concurrency:
  group: release-pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  version-and-tag:
    name: Version packages PR and tags
    runs-on: ubuntu-latest
    steps:
      - name: Create release App token
        id: release_token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.PI_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PI_RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ steps.release_token.outputs.token }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - name: Enable corepack
        run: corepack enable

      - name: Install pnpm from packageManager
        run: corepack prepare --activate

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --config.auto-install-peers=false

      - name: Create or update Version packages PR
        id: changesets
        uses: changesets/action@v1
        with:
          version: pnpm run version-packages
          title: Version packages
          commit: "chore: version packages"
          createGithubReleases: false
        env:
          GITHUB_TOKEN: ${{ steps.release_token.outputs.token }}

      # Tag only after versions have landed on the default branch.
      # When hasChangesets=true, changesets/action just opened/updated a Version PR and left
      # the worktree on changeset-release/<branch> with bumps applied - tagging then would
      # publish unmerged version commits and skip the intentional Version PR gate.
      - name: Create missing package tags
        if: steps.changesets.outputs.hasChangesets == 'false'
        env:
          DEFAULT_BRANCH: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # changesets/action may leave us on changeset-release/*; always tag the push commit.
          git fetch origin "$DEFAULT_BRANCH" --tags
          git checkout -B "$DEFAULT_BRANCH" "origin/$DEFAULT_BRANCH"

          # tag-packages prints one tag per line; ignore non-tag footer lines
          mapfile -t TAGS < <(node scripts/tag-packages.mjs | grep -E '^@whamp/' || true)
          if [ "${#TAGS[@]}" -eq 0 ]; then
            echo "No missing package tags"
            exit 0
          fi

          for TAG in "${TAGS[@]}"; do
            [ -n "${TAG}" ] || continue
            if git rev-parse -q --verify "refs/tags/${TAG}" >/dev/null; then
              echo "Tag already exists: ${TAG}"
              continue
            fi
            git tag -a "${TAG}" -m "Release ${TAG}"
            # App-authenticated tag pushes trigger publish.yml.
            git push origin "refs/tags/${TAG}"
            echo "Tagged ${TAG} (publish.yml will run from the tag push)"
          done

      - name: Skip tagging while Version PR is open
        if: steps.changesets.outputs.hasChangesets == 'true'
        run: |
          echo "Pending changesets: Version packages PR opened/updated."
          echo "Tags and publish run only after that PR merges onto ${{ github.ref_name }}."
